# 本地合成 Responses 流经过实际 pi-ai、Agent Loop 和持久会话。
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-deepseek
        disabled: true
      - insert:
          - id: llm-pi-ai
            name: '@deepseek-ai/dsh-llm-pi-ai'
            config:
              providers:
                openai:
                  apiKeyEnv: PI_RESPONSES_SNAPSHOT_KEY
                  baseURL: !!js process.env.DSH_SNAPSHOT_BASE_URL
                  retryPolicy:
                    mode: normal
                    backoff:
                      initialDelayMs: 1
                      maxDelayMs: 1
                      jitterRatio: 0
      - id: agent-spine
        config:
          agents:
            - id: main
              provider: openai
              model: gpt-4.1
              cwd: !!js process.cwd()
          workspaceContext: false
          persona: '仅验证合成 Responses 断流恢复。'
      - id: persistence
        config:
          root: './.sessions'
